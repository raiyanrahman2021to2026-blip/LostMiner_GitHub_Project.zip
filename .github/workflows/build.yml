name: Build LostMiner HD
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack the zip
        run: |
          mkdir work
          for z in *.zip; do
            if unzip -l "$z" | grep -q apk.part00; then unzip -o "$z" -d work; fi
          done
          ls work
      - name: Patch APK
        run: cd work && python patch_apk.py
      - name: Align and sign
        run: |
          cd work
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LostMiner HD"
          $BT/apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out LostMiner_HD.apk aligned.apk
          $BT/apksigner verify -v LostMiner_HD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LostMiner_HD
          path: work/LostMiner_HD.apk
